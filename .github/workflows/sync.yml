# Keeps the internship catalog fresh.
#
# Every 2 hours (on the hour's :17): a full pass. Fetch every feed and a
# rotating slice of company boards, reconcile which listings are still open
# (delistings, passed deadlines, stale postings), merge duplicates, and
# link-check the least-recently-verified listings so dead links get closed.
#
# Every 2 hours in between (:47 on odd hours): a fresh-postings pass that reads
# only the fast, high-churn feeds (the community GitHub lists, Hacker News,
# Jane Street, Amazon) and a small board slice. It takes a few minutes, so new
# roles show up within about an hour of being listed while the expensive full
# pass keeps its 2-hour cadence.
#
# Free-tier budget: GitHub Actions minutes are unlimited for public
# repositories. On a private repository the free plan includes 2,000 minutes a
# month, which this schedule exceeds; there, delete the fresh-postings cron
# line below and keep the 2-hour full pass (or run the full pass every 4h).
#
# The catalog tracks several thousand employer boards, so no single run touches
# them all. Boards are picked least-recently-synced first and round-robin across
# providers, which walks the whole set roughly every day and a half.
#
# Requires one repository secret:
#   SUPABASE_DB_URL is the Supabase Postgres connection string
#     (Supabase Dashboard → Connect → Transaction pooler, port 6543)

name: Sync internship catalog

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '47 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      max_boards:
        description: 'Company boards to touch this run'
        default: '900'
      verify:
        description: 'Listings to link-check afterwards'
        default: '500'
      kinds:
        description: 'Restrict to these source kinds (comma separated, blank for all)'
        default: ''
      enrich:
        description: 'Bare postings to fetch full descriptions for'
        default: '400'

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync sources into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Read through the environment rather than interpolated into the
          # script, so a dispatch input can never become shell syntax.
          FRESH_PASS: ${{ github.event.schedule == '47 1-23/2 * * *' }}
          MAX_BOARDS: ${{ inputs.max_boards || '900' }}
          ENRICH: ${{ inputs.enrich || '400' }}
          VERIFY: ${{ inputs.verify || '500' }}
          KINDS: ${{ inputs.kinds }}
        run: |
          if [ "$FRESH_PASS" = "true" ]; then
            # Fast feeds plus a small slice of the quickest ATS boards. The Muse
            # and the slow enterprise ATSs wait for the full pass.
            MAX_BOARDS=120
            VERIFY=150
            ENRICH=150
            KINDS="github,hn,janestreet,amazon,greenhouse,lever,ashby"
          fi
          npm run sync -- \
            --max-boards "$MAX_BOARDS" \
            --concurrency 14 \
            ${KINDS:+--kinds "$KINDS"} \
            --enrich "$ENRICH" \
            --verify "$VERIFY"

      # Applies classifier changes to listings already in the catalog, rather
      # than waiting a day or two for every board to be fetched again. It runs
      # once per classifier version and returns immediately after that.
      - name: Reclassify catalog into new fields
        # Independent of the sync's outcome: one failing source or step should
        # not hold a taxonomy change back from the rest of the catalog.
        if: ${{ !cancelled() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run reclassify
